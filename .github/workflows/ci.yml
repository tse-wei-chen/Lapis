name: ci

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      managed: ${{ steps.filter.outputs.managed }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect affected build planes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          managed=false
          native=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            managed=true
            native=true
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            cat changed-files.txt

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml)
                  managed=true
                  native=true
                  ;;
                native/*)
                  # Native changes also run managed architecture tests, which
                  # enforce the FFmpeg/native adapter boundary.
                  managed=true
                  native=true
                  ;;
                src/*|tests/*|Lapis.slnx|Directory.Build.props|Directory.Packages.props|global.json|.editorconfig)
                  managed=true
                  ;;
              esac
            done < changed-files.txt
          fi

          echo "managed=$managed" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  managed:
    needs: changes
    if: needs.changes.outputs.managed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Lapis.slnx
      - name: Build
        run: dotnet build Lapis.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Lapis.slnx -c Release --no-build --logger "trx;LogFileName=managed.trx"

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/MediaRuntime/vcpkg.json', 'native/MediaRuntime/vcpkg-triplets/*.cmake') }}
      - name: Prepare vcpkg baseline
        shell: pwsh
        run: |
          $vcpkgExe = (Get-Command vcpkg).Source
          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          git -C $vcpkgRoot fetch origin a5f736224e85b32e25a8ffc52562333180396642 --depth=1
          # Keep the active registry consistent with builtin-baseline.
          # Fetching the commit without checking it out is insufficient.
          git -C $vcpkgRoot -c advice.detachedHead=false checkout --detach a5f736224e85b32e25a8ffc52562333180396642
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Configure
        shell: pwsh
        run: |
          cmake -S native/MediaRuntime -B build/native -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/native/MediaRuntime/vcpkg-triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-release"
      - name: Save vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('native/MediaRuntime/vcpkg.json', 'native/MediaRuntime/vcpkg-triplets/*.cmake') }}
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      # The Native plane alone has the real FFmpeg/D3D11 DLL available.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Real WinForms and native playback lifecycle acceptance
        shell: pwsh
        timeout-minutes: 4
        run: |
          # Ordinary managed CI never needs to load FFmpeg or D3D11.
          dotnet build tests/Lapis.Desktop.WinForms.Tests/Lapis.Desktop.WinForms.Tests.csproj -c Release
          $nativeDir = (Resolve-Path "build/native/Release").Path
          $testDir = (Resolve-Path "tests/Lapis.Desktop.WinForms.Tests/bin/Release/net10.0-windows").Path
          Copy-Item (Join-Path $nativeDir "Lapis.MediaRuntime.dll") $testDir -Force
          $env:PATH = "$nativeDir;$env:PATH"
          $env:LAPIS_NATIVE_UI_ACCEPTANCE = "1"
          $env:LAPIS_NATIVE_UI_MEDIA = (Resolve-Path "native/MediaRuntime/tests/assets/test_soak_churn.mp4").Path
          dotnet test tests/Lapis.Desktop.WinForms.Tests/Lapis.Desktop.WinForms.Tests.csproj `
            -c Release --no-build `
            --filter "FullyQualifiedName~NativeWinFormsPlaybackAcceptanceTests" `
            --logger "trx;LogFileName=native-winforms-acceptance.trx"

