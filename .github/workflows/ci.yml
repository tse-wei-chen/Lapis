name: ci

# A new push supersedes an earlier run on the same PR/ref. Avoid paying for
# multiple 15-minute FFmpeg builds after a rapid succession of fixes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      managed: ${{ steps.filter.outputs.managed }}
      native: ${{ steps.filter.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect affected build planes
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          managed=false
          native=false

          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            managed=true
            native=true
          else
            git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt
            cat changed-files.txt

            while IFS= read -r file; do
              case "$file" in
                .github/workflows/ci.yml)
                  managed=true
                  native=true
                  ;;
                native/*)
                  # Native changes also run managed architecture tests, which
                  # enforce the FFmpeg/native adapter boundary.
                  managed=true
                  native=true
                  ;;
                src/Lapis.Desktop.Avalonia/*|tests/Lapis.Desktop.E2E/*|tests/Lapis.Desktop.Avalonia.Tests/NativeAvaloniaPlaybackAcceptanceTests.cs)
                  # UI changes always exercise the actual Lapis.exe via Win32
                  # UI Automation AND the native D3D11 playback acceptance.
                  managed=true
                  native=true
                  ;;
                src/*|tests/*|Lapis.slnx|Directory.Build.props|Directory.Packages.props|global.json|.editorconfig)
                  managed=true
                  ;;
              esac
            done < changed-files.txt
          fi

          echo "managed=$managed" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"

  managed:
    needs: changes
    if: needs.changes.outputs.managed == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore Lapis.slnx
      - name: Build
        run: dotnet build Lapis.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Lapis.slnx -c Release --no-build --logger "trx;LogFileName=managed.trx"

  native:
    needs: changes
    if: needs.changes.outputs.native == 'true'
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}\\.vcpkg-cache,readwrite
    steps:
      - uses: actions/checkout@v7
      # A v1 cache can be "hit" but contain archives with obsolete ABI hashes.
      # Use a rolling v2 key: old archives can be read as a starting point,
      # and a rebuilt FFmpeg archive can be saved under a NEW immutable key.
      - name: Restore vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-v2-${{ runner.os }}-${{ hashFiles('native/MediaRuntime/vcpkg.json', 'native/MediaRuntime/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-v2-${{ runner.os }}-${{ hashFiles('native/MediaRuntime/vcpkg.json', 'native/MediaRuntime/vcpkg-triplets/*.cmake') }}-
      - name: Prepare vcpkg baseline
        shell: pwsh
        run: |
          $vcpkgExe = (Get-Command vcpkg).Source
          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          git -C $vcpkgRoot fetch origin a5f736224e85b32e25a8ffc52562333180396642 --depth=1
          # Keep the active registry consistent with builtin-baseline.
          # Fetching the commit without checking it out is insufficient.
          git -C $vcpkgRoot -c advice.detachedHead=false checkout --detach a5f736224e85b32e25a8ffc52562333180396642
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Measure cached vcpkg archives
        id: vcpkg-before
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem .vcpkg-cache -Recurse -File -Filter '*.zip' -ErrorAction SilentlyContinue)
          "count=$($archives.Count)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Configure
        shell: pwsh
        run: |
          cmake -S native/MediaRuntime -B build/native -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/native/MediaRuntime/vcpkg-triplets" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-release"
      - name: Detect new vcpkg binary archives
        id: vcpkg-after
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem .vcpkg-cache -Recurse -File -Filter '*.zip' -ErrorAction SilentlyContinue)
          $before = [int]'${{ steps.vcpkg-before.outputs.count }}'
          $changed = $archives.Count -gt $before
          Write-Host "vcpkg archive count: $before -> $($archives.Count); cache updated: $changed"
          "changed=$($changed.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      # Cache keys are immutable. Save only when vcpkg created additional
      # ABI-addressed package archives, instead of freezing an obsolete hit
      # forever or uploading the same 20+ MiB cache on every CI run.
      - name: Save vcpkg binary cache
        if: steps.vcpkg-after.outputs.changed == 'true'
        uses: actions/cache/save@v6
        with:
          path: .vcpkg-cache
          key: vcpkg-v2-${{ runner.os }}-${{ hashFiles('native/MediaRuntime/vcpkg.json', 'native/MediaRuntime/vcpkg-triplets/*.cmake') }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Build
        run: cmake --build build/native --config Release
      - name: Test
        run: ctest --test-dir build/native -C Release --output-on-failure
      # Native FFmpeg/D3D11 DLL is required for Avalonia acceptance.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      # An actual Avalonia Win32 desktop lifetime / NativeControlHost /
      # FFmpeg D3D11 swap chain acceptance; never a headless GPU mock.
      - name: Real Avalonia native HWND playback acceptance
        shell: pwsh
        timeout-minutes: 4
        run: |
          dotnet build tests/Lapis.Desktop.Avalonia.Tests/Lapis.Desktop.Avalonia.Tests.csproj -c Release
          # Test the PRODUCT deployment, not just a test host with Native's
          # build folder injected into PATH (which previously hid missing DLLs).
          dotnet build src/Lapis.Desktop.Avalonia/Lapis.Desktop.Avalonia.csproj -c Release
          $nativeDir = (Resolve-Path "build/native/Release").Path
          $appDir = (Resolve-Path "src/Lapis.Desktop.Avalonia/bin/Release/net10.0-windows").Path
          $testDir = (Resolve-Path "tests/Lapis.Desktop.Avalonia.Tests/bin/Release/net10.0-windows").Path
          $nativeDlls = @(Get-ChildItem -Path $nativeDir -Filter "*.dll" -File)
          if ($nativeDlls.Count -le 1) {
            throw "Native output contains no dependency DLLs; FFmpeg app-local staging is missing."
          }
          foreach ($dll in $nativeDlls) {
            if (-not (Test-Path (Join-Path $appDir $dll.Name))) {
              throw "Avalonia app deployment missing $($dll.Name)."
            }
          }
          Copy-Item (Join-Path $nativeDir "*.dll") $testDir -Force
          # No PATH override. Native acceptance must resolve DLLs beside the app.
          $env:LAPIS_AVALONIA_NATIVE_ACCEPTANCE = "1"
          $env:LAPIS_NATIVE_UI_MEDIA = (Resolve-Path "native/MediaRuntime/tests/assets/test_soak_churn.mp4").Path
          dotnet test tests/Lapis.Desktop.Avalonia.Tests/Lapis.Desktop.Avalonia.Tests.csproj `
            -c Release --no-build `
            --filter "FullyQualifiedName~NativeAvaloniaPlaybackAcceptanceTests" `
            --logger "trx;LogFileName=native-avalonia-acceptance.trx"

      # Separate black-box E2E suite: launches the *built product EXE* in a
      # child process, drives it through UI Automation and captures desktop
      # screenshots and the accessibility tree. This is NOT a Headless mock.
      - name: Actual Windows desktop UI E2E
        shell: pwsh
        timeout-minutes: 7
        run: |
          $app = (Resolve-Path "src/Lapis.Desktop.Avalonia/bin/Release/net10.0-windows/Lapis.Desktop.Avalonia.exe").Path
          $media = (Resolve-Path "native/MediaRuntime/tests/assets/test_soak_churn.mp4").Path
          $artifacts = Join-Path "${{ github.workspace }}" "build/e2e-artifacts"
          New-Item -ItemType Directory -Force -Path $artifacts | Out-Null
          $env:LAPIS_E2E_EXE = $app
          $env:LAPIS_E2E_MEDIA = $media
          $env:LAPIS_E2E_ARTIFACTS = $artifacts
          dotnet test tests/Lapis.Desktop.E2E/Lapis.Desktop.E2E.csproj -c Release `
            --logger "trx;LogFileName=windows-desktop-e2e.trx" `
            --results-directory "$artifacts"
      - name: Upload Windows E2E screenshots and TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lapis-windows-desktop-e2e
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/e2e-artifacts/**

